# TestPilot 生产形态编排模板（首期不引入 k8s，见 design 13.4）。
#
#   cp deploy/.env.example deploy/.env   # 填密钥
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# 入口：http://localhost:8080（REST+前端托管）；Jaeger UI http://localhost:16686；
# Prometheus http://localhost:9091。OTLP 统一进 otel-collector（traces→Jaeger，Worker/Copilot 推送式指标→Prometheus）。Worker 扩缩：--scale worker=4（或 .env WORKER_REPLICAS）。

name: testpilot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: testpilot
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set in .env}
      POSTGRES_DB: testpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # 本机工具/迁移冒烟便利；仅回环，生产可删
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testpilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: deploy/scheduler.Dockerfile
    environment:
      TP_DB_DSN: postgres://testpilot:${PG_PASSWORD}@postgres:5432/testpilot?sslmode=disable
      TP_JWT_SECRET: ${TP_JWT_SECRET:?set in .env}
      TP_ADMIN_PASSWORD: ${TP_ADMIN_PASSWORD:-}   # 空=回落 admin123（启动时 stderr 告警）
      TP_JWT_EXPIRE_HOURS: ${TP_JWT_EXPIRE_HOURS:-24}
      TP_REGISTRATION_ENABLED: ${TP_REGISTRATION_ENABLED:-false}
      TP_SNOWFLAKE_NODE: ${TP_SNOWFLAKE_NODE:-1}
      TP_WORKER_TOKEN: ${TP_WORKER_TOKEN:?set in .env}
      # 租户级 Worker 令牌（可选，格式 "租户ID=令牌,..."）：防共享令牌自报他人租户
      TP_WORKER_TENANT_TOKENS: ${TP_WORKER_TENANT_TOKENS:-}
      TP_DB_MAX_OPEN_CONNS: ${TP_DB_MAX_OPEN_CONNS:-20}
      TP_DB_MAX_IDLE_CONNS: ${TP_DB_MAX_IDLE_CONNS:-5}
      TP_DB_CONN_MAX_LIFETIME_MIN: ${TP_DB_CONN_MAX_LIFETIME_MIN:-30}
      TP_BODY_LIMIT_MB: ${TP_BODY_LIMIT_MB:-64}
      TP_RETENTION_RUN_DAYS: ${TP_RETENTION_RUN_DAYS:-0}
      TP_ARTIFACT_DIR: /data/artifacts
      TP_ARTIFACT_BACKEND: ${TP_ARTIFACT_BACKEND:-local}
      TP_S3_ENDPOINT: ${TP_S3_ENDPOINT:-}
      TP_S3_ACCESS_KEY: ${TP_S3_ACCESS_KEY:-}
      TP_S3_SECRET_KEY: ${TP_S3_SECRET_KEY:-}
      TP_S3_BUCKET: ${TP_S3_BUCKET:-}
      TP_S3_REGION: ${TP_S3_REGION:-}
      TP_S3_PREFIX: ${TP_S3_PREFIX:-}
      TP_S3_USE_SSL: ${TP_S3_USE_SSL:-true}
      TP_S3_PATH_STYLE: ${TP_S3_PATH_STYLE:-false}
      TP_METRICS_ALLOWED_CIDRS: ${TP_METRICS_ALLOWED_CIDRS:-}
      TP_NOTIFY_ALLOW_PRIVATE: ${TP_NOTIFY_ALLOW_PRIVATE:-0}
      TP_OTEL_EXPORTER: ${TP_OTEL_EXPORTER:-otlp}
      TP_OTEL_ENDPOINT: otel-collector:4317
      TP_LOG_FORMAT: json
      # 前端 /copilot-api/* 由 scheduler 反代到 copilot（SSE 生产入口收敛到 :8080）
      TP_COPILOT_URL: http://copilot:8100
    volumes:
      - artifacts:/data/artifacts
    ports:
      # 默认仅本机可达（未设 TP_HTTP_BIND/TP_GRPC_BIND 时回退 127.0.0.1，而非 0.0.0.0）；
      # 生产对外暴露需前置网关（鉴权/限流/HTTPS 终止）。种子 admin 口令务必在
      # .env 设置 TP_ADMIN_PASSWORD（弱口令=裸奔 owner）。
      - "${TP_HTTP_BIND:-127.0.0.1}:8080:8080"   # REST + 前端
      - "${TP_GRPC_BIND:-127.0.0.1}:9090:9090"   # gRPC（仅编排外 Worker/Copilot 需要时暴露）
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    command: ["--scheduler", "scheduler:9090",
              "--capabilities", "functional,lowcode,playwright",
              "--tags", "region=local", "--max-concurrency", "4"]
    environment:
      TP_ARTIFACT_DIR: /data/artifacts
      TP_OTEL_EXPORTER: ${TP_OTEL_EXPORTER:-otlp}
      TP_OTEL_ENDPOINT: otel-collector:4317
      TP_EGRESS_ALLOW: ${TP_EGRESS_ALLOW:-}
      TP_EGRESS_BLOCK_PRIVATE: ${TP_EGRESS_BLOCK_PRIVATE:-1}
      TP_SANDBOX_REQUIRE_ISOLATION: ${TP_SANDBOX_REQUIRE_ISOLATION:-0}
      TP_WORKER_TENANT_ID: ${TP_WORKER_TENANT_ID:-0}
      TP_WORKER_TOKEN: ${TP_WORKER_TOKEN:?set in .env}
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright
    volumes:
      - artifacts:/data/artifacts
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    depends_on:
      - scheduler
    restart: unless-stopped

  # 压测 Worker 独立编排（独占式调度，压测期间不接功能任务）
  worker-stress:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    command: ["--scheduler", "scheduler:9090", "--capabilities", "stress",
              "--tags", "region=local", "--max-concurrency", "1"]
    environment:
      TP_ARTIFACT_DIR: /data/artifacts
      TP_OTEL_EXPORTER: ${TP_OTEL_EXPORTER:-otlp}
      TP_OTEL_ENDPOINT: otel-collector:4317
      TP_EGRESS_ALLOW: ${TP_EGRESS_ALLOW:-}
      TP_EGRESS_BLOCK_PRIVATE: ${TP_EGRESS_BLOCK_PRIVATE:-1}
      TP_SANDBOX_REQUIRE_ISOLATION: ${TP_SANDBOX_REQUIRE_ISOLATION:-0}
      TP_WORKER_TENANT_ID: ${TP_WORKER_TENANT_ID:-0}
      TP_WORKER_TOKEN: ${TP_WORKER_TOKEN:?set in .env}
    volumes:
      - artifacts:/data/artifacts
    deploy:
      replicas: ${STRESS_WORKER_REPLICAS:-1}
    depends_on:
      - scheduler
    restart: unless-stopped

  copilot:
    build:
      context: ..
      dockerfile: deploy/copilot.Dockerfile
    environment:
      TP_COPILOT_PROVIDER: ${TP_COPILOT_PROVIDER:-deepseek}
      TP_COPILOT_API_KEY: ${TP_COPILOT_API_KEY:?set in .env}
      TP_COPILOT_BASE_URL: ${TP_COPILOT_BASE_URL:-}
      TP_COPILOT_MODEL: ${TP_COPILOT_MODEL:-deepseek-v4-flash}
      TP_COPILOT_MODEL_TIMEOUT: ${TP_COPILOT_MODEL_TIMEOUT:-120}
      TP_COPILOT_STREAM_IDLE_TIMEOUT: ${TP_COPILOT_STREAM_IDLE_TIMEOUT:-300}
      TP_SCHEDULER_GRPC: scheduler:9090
      TP_SCHEDULER_REST: http://scheduler:8080
      TP_COPILOT_ADDR: 0.0.0.0:8100
      TP_OTEL_EXPORTER: ${TP_OTEL_EXPORTER:-otlp}
      TP_OTEL_ENDPOINT: otel-collector:4317
    # 端口暴露仅调试用：生产前端经 scheduler /copilot-api 反代，无需对外 8100
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      - scheduler
    restart: unless-stopped

  # 链路存储：OTLP 由 otel-collector 转发进来（jaeger:4317 仅容器网络内），UI :16686。
  jaeger:
    image: jaegertracing/jaeger:2.12.0
    ports:
      # 宿主端口仅本机调试用（无鉴权）
      - "127.0.0.1:16686:16686"
    restart: unless-stopped

  # OTLP 统一入口：traces → Jaeger；metrics → Prometheus 文本格式 :8889（被 prometheus
  # 抓取）。Worker/Copilot 无可抓取 HTTP 面，指标只能 OTLP 推送，经此收敛落库。
  otel-collector:
    image: otel/opentelemetry-collector:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # 宿主映射给 compose 外的本机进程（本地 dev 直跑 worker/copilot 时推送用）
      - "127.0.0.1:4317:4317"
    depends_on:
      - jaeger
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.9.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9091:9090"   # 无鉴权，不对外
    depends_on:
      - scheduler
      - otel-collector
    restart: unless-stopped

volumes:
  pgdata:
  artifacts:
