[project]
name = "testpilot-copilot"
version = "0.1.0"
description = "TestPilot Copilot — AI 生成与分析（FastAPI + pydantic-ai）"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai-slim==2.28.0",
    "pydantic-ai-extensions>=0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "tiktoken>=0.12",
    "httpx>=0.27",
    "openai>=1.50",
    "grpcio>=1.60",
    "protobuf>=5",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
]

[project.scripts]
testpilot-copilot = "testpilot_copilot.main:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testpilot_copilot"]

[tool.uv.sources]
# 未发布到公共 PyPI，随库 vendor；uv sync 直接解析本地 wheel
pydantic-ai-extensions = { path = "vendor/pydantic_ai_extensions-0.1.0-py3-none-any.whl" }
