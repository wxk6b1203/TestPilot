syntax = "proto3";

// TestPilot Copilot 工具服务契约（Copilot ↔ Scheduler）
// Copilot 作为 gRPC 客户端调用 Scheduler；不直连 DB。
// 所有请求携带 RequestContext（租户 + 用户 + actor），受 RBAC 约束。
// 读类工具免审批；写/触发类工具由 Copilot 层做人机协同（HITL）审批后调用。
package testpilot.copilot.v1;

import "testpilot/common/v1/types.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/testpilot/testpilot/gen/copilot/v1;copilotv1";
option java_multiple_files = true;
option java_package = "com.testpilot.copilot.v1";

service CopilotToolService {
  // ---- 只读工具（免审批） ----
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc ListApis(ListApisRequest) returns (ListApisResponse);
  rpc GetApi(GetApiRequest) returns (GetApiResponse);
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);
  rpc ListTestCases(ListTestCasesRequest) returns (ListTestCasesResponse);
  rpc GetTestCase(GetTestCaseRequest) returns (GetTestCaseResponse);
  rpc QuerySchema(QuerySchemaRequest) returns (QuerySchemaResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc QueryCoverage(QueryCoverageRequest) returns (QueryCoverageResponse);
  rpc QueryApiDirectory(QueryApiDirectoryRequest) returns (QueryApiDirectoryResponse);
  rpc CheckVariableRefs(CheckVariableRefsRequest) returns (CheckVariableRefsResponse);

  // ---- 写工具（默认 HITL 审批） ----
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc CreateApi(CreateApiRequest) returns (CreateApiResponse);
  rpc UpdateApi(UpdateApiRequest) returns (UpdateApiResponse);
  rpc CreateTestCase(CreateTestCaseRequest) returns (CreateTestCaseResponse);
  rpc UpdateTestCase(UpdateTestCaseRequest) returns (UpdateTestCaseResponse);
  rpc CreateTestPlan(CreateTestPlanRequest) returns (CreateTestPlanResponse);
  rpc ImportOpenApi(ImportOpenApiRequest) returns (ImportOpenApiResponse);
  rpc ApplyOpenApiDiff(ApplyOpenApiDiffRequest) returns (ApplyOpenApiDiffResponse);

  // ---- 触发工具（默认 HITL 审批） ----
  rpc TriggerRun(TriggerRunRequest) returns (TriggerRunResponse);
  rpc TriggerStress(TriggerStressRequest) returns (TriggerStressResponse);

  // ---- UI 探测（v1）：会话生命周期类只读（snapshot/close），资源/副作用类写（open/act/eval，HITL） ----
  rpc OpenProbe(OpenProbeRequest) returns (OpenProbeResponse);
  rpc GetProbeSnapshot(GetProbeSnapshotRequest) returns (GetProbeSnapshotResponse);
  rpc CloseProbe(CloseProbeRequest) returns (CloseProbeResponse);
  rpc ActProbe(ActProbeRequest) returns (ActProbeResponse);
  rpc EvalProbe(EvalProbeRequest) returns (EvalProbeResponse);
}

enum ApiKind {
  API_KIND_UNSPECIFIED = 0;
  API_KIND_HTTP = 1;
  API_KIND_GRPC = 2;
}

// ---------------------------------------------------------------------------
// 只读
// ---------------------------------------------------------------------------

message ListProjectsRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  testpilot.common.v1.PageRequest page = 2;
  string query = 3;
}
message ListProjectsResponse {
  repeated testpilot.common.v1.Project projects = 1;
  testpilot.common.v1.PageResponse page = 2;
}

message ListApisRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string project_id = 2;
  testpilot.common.v1.PageRequest page = 3;
  string query = 4;
}
message ListApisResponse {
  repeated testpilot.common.v1.HttpApi http_apis = 1;
  repeated testpilot.common.v1.GrpcApi grpc_apis = 2;
  testpilot.common.v1.PageResponse page = 3;
}

message GetApiRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string api_id = 2;
  ApiKind kind = 3;
}
message GetApiResponse {
  oneof api {
    testpilot.common.v1.HttpApi http = 1;
    testpilot.common.v1.GrpcApi grpc = 2;
  }
}

message ListEnvironmentsRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string project_id = 2;
}
message ListEnvironmentsResponse {
  repeated testpilot.common.v1.Environment environments = 1;
}

message ListTestCasesRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string project_id = 2;
  testpilot.common.v1.PageRequest page = 3;
  string query = 4;
  repeated string tags = 5;
}
message ListTestCasesResponse {
  repeated testpilot.common.v1.TestCase cases = 1;
  testpilot.common.v1.PageResponse page = 2;
}

message GetTestCaseRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string case_id = 2;
}
message GetTestCaseResponse {
  testpilot.common.v1.TestCase case = 1;
}

// 领域 schema / 数据字典（Copilot grounding，见 7.4）
message QuerySchemaRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string topic = 2;   // 可选：限定主题（如 http_api、test_step、lowcode_sdk）
}
message QuerySchemaResponse {
  string schema_json = 1;   // 领域模型 JSON Schema / 数据字典
  string version = 2;
}

message ListRunsRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string project_id = 2;
  string plan_id = 3;
  testpilot.common.v1.RunStatus status = 4;
  testpilot.common.v1.PageRequest page = 5;
}
message ListRunsResponse {
  repeated testpilot.common.v1.TestRun runs = 1;
  testpilot.common.v1.PageResponse page = 2;
}

message GetRunRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string run_id = 2;
  bool include_steps = 3;
}
message GetRunResponse {
  testpilot.common.v1.TestRun run = 1;
  repeated testpilot.common.v1.TestCaseResult case_results = 2;
  repeated testpilot.common.v1.TestStepResult step_results = 3;   // include_steps 时返回
}

// 覆盖率分析：接口 vs 用例覆盖缺口
message QueryCoverageRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string project_id = 2;
}
message QueryCoverageResponse {
  int32 total_apis = 1;
  int32 covered_apis = 2;
  repeated string uncovered_api_ids = 3;
  double coverage_ratio = 4;
}

// 接口目录问答：返回项目目录树 + 接口摘要的扁平条目（含 human-readable 路径），
// 供 Copilot 回答“某目录下有哪些接口 / 接口挂在哪个目录”等问题。
message ApiDirectoryEntry {
  string node_id = 1;
  string parent_id = 2;
  string parent_name = 3;
  int32 node_type = 4;          // common.NodeType：1=folder 2=http_api 3=grpc_api …
  string name = 5;
  string ref_id = 6;            // 接口/用例等实体 id（folder 为空）
  string path = 7;              // 人读路径，如 /订单/支付/创建订单
  int32 method = 8;             // 仅 http_api
  string uri = 9;               // 仅 http_api
  string full_service = 10;     // 仅 grpc_api
  string rpc_method = 11;       // 仅 grpc_api
}

message QueryApiDirectoryRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string project_id = 2;
  string query = 3;             // 按名称/uri/service/method 模糊过滤
  string parent_node_id = 4;    // 只返回该目录子树（可选）
}

message QueryApiDirectoryResponse {
  repeated ApiDirectoryEntry entries = 1;
  int32 total = 2;
  string summary = 3;
}

// 变量引用检查：扫描项目接口与用例中的 {{expr}} 模板，报告未定义变量。
message VariableRefIssue {
  string location = 1;          // 如 http_api:123 / case:456
  string field = 2;             // 如 uri / headers / definition
  string variable = 3;          // 未定义的根变量名
  string expression = 4;        // 完整模板表达式（可能较长，截断 200 字符）
}

message CheckVariableRefsRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string project_id = 2;
  string environment_id = 3;    // 可选：仅校验该环境可见变量；空=项目全部变量
}

message CheckVariableRefsResponse {
  repeated string defined_variables = 1;
  repeated VariableRefIssue issues = 2;
  int32 scanned_apis = 3;
  int32 scanned_cases = 4;
}

// ---------------------------------------------------------------------------
// 写
// ---------------------------------------------------------------------------

message CreateProjectRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string name = 2;
  string description = 3;
  google.protobuf.Struct config = 4;   // 可选项目级配置
}

message CreateProjectResponse {
  string project_id = 1;
}

message CreateApiRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string project_id = 2;
  oneof api {
    testpilot.common.v1.HttpApi http = 3;
    testpilot.common.v1.GrpcApi grpc = 4;
  }
  string parent_node_id = 5;   // 目录树挂载点（可选）
}
message CreateApiResponse {
  string api_id = 1;
  string node_id = 2;
}

message UpdateApiRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string api_id = 2;
  ApiKind kind = 3;
  oneof api {
    testpilot.common.v1.HttpApi http = 4;
    testpilot.common.v1.GrpcApi grpc = 5;
  }
}
message UpdateApiResponse {
  string api_id = 1;
}

message CreateTestCaseRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string project_id = 2;
  testpilot.common.v1.TestCase case = 3;
  string parent_node_id = 4;
}
message CreateTestCaseResponse {
  string case_id = 1;
  string node_id = 2;
}

message UpdateTestCaseRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string case_id = 2;
  testpilot.common.v1.TestCase case = 3;   // 完整新定义（name/description/definition）
}
message UpdateTestCaseResponse {
  string case_id = 1;
}

message CreateTestPlanRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string project_id = 2;
  testpilot.common.v1.TestPlan plan = 3;
  string parent_node_id = 4;
}
message CreateTestPlanResponse {
  string plan_id = 1;
  string node_id = 2;
}

message ImportOpenApiRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string project_id = 2;
  oneof spec {
    string openapi_url = 3;
    string openapi_document = 4;   // 原文
  }
  string parent_node_id = 5;
  bool generate_cases = 6;         // 是否同时批量生成用例
}
message ImportOpenApiResponse {
  repeated string api_ids = 1;
  int32 imported_count = 2;
  repeated string case_ids = 3;    // generate_cases 时
}

message DiffEntry {
  string api_id = 1;
  string kind = 2;      // added | removed | changed | breaking
  string summary = 3;
}

message ApplyOpenApiDiffRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string project_id = 2;
  string openapi_document = 3;     // 新 spec
  bool auto_update_cases = 4;
}
message ApplyOpenApiDiffResponse {
  repeated DiffEntry diffs = 1;
  repeated string updated_api_ids = 2;
  repeated string updated_case_ids = 3;
}

// ---------------------------------------------------------------------------
// 触发
// ---------------------------------------------------------------------------

message TriggerRunRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string plan_id = 2;
  string env_id = 3;   // 可覆盖 plan 默认环境
}
message TriggerRunResponse {
  string run_id = 1;
}

message TriggerStressRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string stress_plan_id = 2;
  string env_id = 3;
}
message TriggerStressResponse {
  string run_id = 1;
}

// ---------------------------------------------------------------------------
// UI 探测（v1，设计：docs/ui-probe-design.md §4.1）
// ---------------------------------------------------------------------------

message OpenProbeRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string session_id = 2;   // Copilot 生成，每 chat 会话一个（Scheduler 粘性路由键）
  string url = 3;          // 相对路径基于 env 的 base_url；Scheduler 解析后下发绝对 URL
  string env_id = 4;       // 解析 base_url；空 = Copilot 当前选中环境
}
message OpenProbeResponse {
  string session_id = 1;
  string worker_id = 2;    // 实际承载探测的 Worker
  string final_url = 3;    // 导航后的真实 URL（重定向后）
  string title = 4;
  string aria_snapshot = 5;             // 截断后的 ARIA YAML
  bool snapshot_truncated = 6;
}

message GetProbeSnapshotRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string session_id = 2;
  string ref = 3;          // 可选：子树定位（ARIA YAML 路径），空 = 全页（v1.x 增强，先不支持）
}
message GetProbeSnapshotResponse {
  string final_url = 1;
  string title = 2;
  string aria_snapshot = 3;
  bool snapshot_truncated = 4;
}

message CloseProbeRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string session_id = 2;
}
message CloseProbeResponse { bool ok = 1; }

message ActProbeRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string session_id = 2;
  testpilot.common.v1.UiActionStep action = 3;  // 复用 common 的 UI 动作（与声明式步骤同构）
}
message ActProbeResponse {
  string final_url = 1;
  string title = 2;
  string aria_snapshot = 3;      // 动作执行后自动回快照（一步一反馈）
  bool snapshot_truncated = 4;
  string error = 5;              // 空 = 成功；非空为 Playwright 原始报错
}

message EvalProbeRequest {
  testpilot.common.v1.RequestContext ctx = 1;
  string session_id = 2;
  string expression = 3;         // JS 表达式或 () => {...}（Playwright evaluate 语义）
}
message EvalProbeResponse {
  string result_json = 1;        // JSON 序列化结果（截断至上限）
  bool result_truncated = 2;
  string error = 3;              // JS 异常原文
}
