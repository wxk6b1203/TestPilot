[project]
name = "testpilot-worker"
version = "0.1.0"
description = "TestPilot Worker — 执行功能测试/低代码/Playwright/压测"
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=5",
    "httpx>=0.27",
    "locust>=2",  # stress_runner 直接 import（此前靠手工 pip 安装，容器镜像缺）
    "pydantic>=2",
    "pyyaml>=6",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
]

[project.optional-dependencies]
# UI 变体：testpilot-worker[playwright]（浏览器版本随 Playwright 锁定，
# 安装后需执行 playwright install chromium）
playwright = ["playwright>=1.41"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
testpilot-worker = "testpilot_worker.main:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testpilot_worker", "src/testpilot_sdk", "src/testpilot"]
