name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    name: Proto governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.55.0"

      - name: buf lint
        run: buf lint

      - name: buf breaking (pull request only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          buf breaking --against ".git#ref=origin/${{ github.base_ref }},subdir=proto"

      # 生成复现性检查：protoc v35 + protoc-gen-go v1.28.1 + protoc-gen-go-grpc v1.2.0
      # 与 Python grpcio-tools 1.83.0 / protobuf 7.35.1 保持和 README 一致。
      - uses: arduino/setup-protoc@v3
        with:
          version: "35.0"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: scheduler/go.sum

      - name: Install Go proto plugins
        run: |
          GOBIN="${HOME}/go/bin" go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.28.1
          GOBIN="${HOME}/go/bin" go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.2.0
          echo "${HOME}/go/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python proto tooling
        run: pip install grpcio-tools==1.83.0 protobuf==7.35.1

      - name: Regenerate and verify no drift
        run: bash scripts/proto-check.sh

  scheduler:
    name: Scheduler tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: scheduler/go.sum
      - name: go vet
        working-directory: scheduler
        run: go vet ./...
      - name: go test
        working-directory: scheduler
        run: go test ./...
      - name: go build
        working-directory: scheduler
        run: go build ./cmd/scheduler

  worker:
    name: Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        working-directory: worker
        run: pip install -e ".[dev]"
      - name: pytest
        working-directory: worker
        run: python -m pytest -q -W error::pytest.PytestUnraisableExceptionWarning

  copilot:
    name: Copilot tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        working-directory: copilot
        run: |
          pip install ./vendor/pydantic_ai_extensions-0.1.0-py3-none-any.whl
          pip install -e . pytest
      - name: pytest
        working-directory: copilot
        run: python -m pytest -q

  web:
    name: Web build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: lint
        working-directory: web
        run: pnpm lint
      - name: build
        working-directory: web
        run: pnpm build
